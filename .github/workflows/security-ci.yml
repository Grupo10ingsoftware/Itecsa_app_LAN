name: Security and quality gates

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            capaServidor/package-lock.json
            capaVista/package-lock.json
            tooling/prisma/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --prefix tooling/prisma
          npm ci --prefix capaServidor
          npm ci --prefix capaVista
      - name: Validate Prisma and generate client
        run: |
          npm run prisma:validate --prefix capaServidor
          npm run prisma:generate --prefix capaServidor
      - name: Frontend lint and build
        run: |
          npm run lint --prefix capaVista
          npm run build --prefix capaVista
      - name: Backup failure and recovery regression
        run: node --test deploy/mysql/backup.test.mjs
      - name: Keycloak profile identity contract
        run: node --test deploy/keycloak/profile-contract.test.mjs
      - name: Keycloak support delegation on real server
        run: node --test deploy/keycloak/support-delegation.integration.test.mjs
      - name: Profile registration date contract
        run: node --test capaServidor/test/profileRegistrationDate.test.js capaVista/test/profileDates.test.mjs
      - name: MySQL update preflight regression
        run: node --test capaServidor/test/mysqlUpdatePreflight.test.js
      - name: Production load refresh regressions
        run: node --test capaVista/test/productionLoadRefresh.test.mjs capaVista/test/productionLoadDrafts.test.mjs
      - name: Runtime dependency audit
        run: |
          npm audit --omit=dev --audit-level=high --prefix capaServidor
          npm audit --omit=dev --audit-level=high --prefix capaVista
          npm audit --audit-level=critical --prefix tooling/prisma
      - name: Reject protected data artifacts
        run: bash scripts/verify-data-artifacts.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan git history for secrets
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.2 git /repo --redact --gitleaks-ignore-path /repo/.gitleaksignore --log-opts="--all"
