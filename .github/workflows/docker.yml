name: Docker CI and GHCR publishing

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tooling/prisma/package-lock.json
            capaServidor/package-lock.json
            capaVista/package-lock.json
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Verify sources and images without publishing credentials
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          npm ci --prefix tooling/prisma
          npm ci --prefix capaServidor
          npm run prisma:generate --prefix capaServidor
          (cd capaServidor && node --test)
          npm ci --prefix capaVista
          npm test --prefix capaVista
          npm run lint --prefix capaVista
          npm run build --prefix capaVista
          docker buildx build --load --platform linux/amd64 --target production --build-arg APP_VERSION="$RELEASE_SHA" -f capaServidor/Dockerfile -t itecsa-api:ci .
          docker buildx build --load --platform linux/amd64 --target database-tools --build-arg APP_VERSION="$RELEASE_SHA" -f capaServidor/Dockerfile -t itecsa-db-tools:ci .
          docker buildx build --load --platform linux/amd64 --target production --build-arg APP_VERSION="$RELEASE_SHA" -f capaVista/Dockerfile -t itecsa-web:ci .
  images:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Keep both SHA tags coherent if a release is rerun while another run publishes it.
    concurrency:
      group: images-${{ github.repository }}-${{ github.sha }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            tooling/prisma/package-lock.json
            capaServidor/package-lock.json
            capaVista/package-lock.json
      - name: Select release
        env:
          EVENT: ${{ github.event_name }}
          COMMIT_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$EVENT" = workflow_dispatch ] && [ "$REF_NAME" != main ]; then
            echo 'Las operaciones manuales se ejecutan desde main.' >&2
            exit 1
          fi
          RELEASE_SHA="$COMMIT_SHA"
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]] || { echo 'SHA no valido.' >&2; exit 1; }
          image_prefix="ghcr.io/${REPOSITORY,,}"
          echo "API_REPO=$image_prefix-api" >> "$GITHUB_ENV"
          echo "WEB_REPO=$image_prefix-web" >> "$GITHUB_ENV"
          echo "DB_TOOLS_REPO=$image_prefix-db-tools" >> "$GITHUB_ENV"
          echo "RELEASE_SHA=$RELEASE_SHA" >> "$GITHUB_ENV"
      - name: Install dependencies and build frontend
        run: |
          npm ci --prefix tooling/prisma
          npm ci --prefix capaServidor
          npm run prisma:generate --prefix capaServidor
          (cd capaServidor && node --test)
          npm ci --prefix capaVista
          npm test --prefix capaVista
          npm run lint --prefix capaVista
          npm run build --prefix capaVista
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Build API
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: capaServidor/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: itecsa-api:ci
          build-args: APP_VERSION=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build database tools
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: capaServidor/Dockerfile
          target: database-tools
          platforms: linux/amd64
          load: true
          tags: itecsa-db-tools:ci
          build-args: APP_VERSION=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=db-tools
          cache-to: type=gha,mode=max,scope=db-tools
      - name: Build web
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: capaVista/Dockerfile
          target: production
          platforms: linux/amd64
          load: true
          tags: itecsa-web:ci
          build-args: APP_VERSION=${{ env.RELEASE_SHA }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Login GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish built images
        run: |
          docker tag itecsa-api:ci "$API_REPO:sha-$RELEASE_SHA"
          docker tag itecsa-web:ci "$WEB_REPO:sha-$RELEASE_SHA"
          docker tag itecsa-db-tools:ci "$DB_TOOLS_REPO:sha-$RELEASE_SHA"
          docker push "$API_REPO:sha-$RELEASE_SHA"
          docker push "$WEB_REPO:sha-$RELEASE_SHA"
          docker push "$DB_TOOLS_REPO:sha-$RELEASE_SHA"
      - name: Resolve immutable release
        if: github.event_name != 'pull_request'
        run: |
          api_digest="$(docker buildx imagetools inspect "$API_REPO:sha-$RELEASE_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          web_digest="$(docker buildx imagetools inspect "$WEB_REPO:sha-$RELEASE_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          db_tools_digest="$(docker buildx imagetools inspect "$DB_TOOLS_REPO:sha-$RELEASE_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$api_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$web_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          [[ "$db_tools_digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          jq -n --arg version "$RELEASE_SHA" --arg api "$API_REPO@$api_digest" --arg web "$WEB_REPO@$web_digest" --arg dbTools "$DB_TOOLS_REPO@$db_tools_digest" '{version:$version,api:$api,web:$web,dbTools:$dbTools}' > release.json
          printf '\nCommit: `%s`\n\nAPI: `%s@%s`\n\nWeb: `%s@%s`\n\nDB tools: `%s@%s`\n' "$RELEASE_SHA" "$API_REPO" "$api_digest" "$WEB_REPO" "$web_digest" "$DB_TOOLS_REPO" "$db_tools_digest" >> "$GITHUB_STEP_SUMMARY"
      - name: Save image references
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-${{ env.RELEASE_SHA }}
          path: release.json
          retention-days: 90
          overwrite: true
