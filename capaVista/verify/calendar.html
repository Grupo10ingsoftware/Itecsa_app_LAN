<!doctype html>
<html lang="es">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisión local del Calendario</title>
<style>
  body { margin: 0; background: #F5F6F8; font-family: system-ui; }
  nav { padding: 12px; display: flex; gap: 16px; flex-wrap: wrap; }
  iframe { display: block; border: 0; max-width: 100%; height: 1400px; margin: auto; }
</style>
<nav aria-label="Tamaños de revisión">
  <a href="?width=1600">Escritorio 1600</a>
  <a href="?width=1024">Tableta 1024</a>
  <a href="?width=390">Móvil 390</a>
  <span>Datos sintéticos. No escribe en la API.</span>
</nav>
<iframe title="Calendario de prueba" src="calendarScene.html"></iframe>
<script>
  const width = Number(new URLSearchParams(location.search).get('width'));
  document.querySelector('iframe').style.width = `${[1600, 1024, 390].includes(width) ? width : 1600}px`;
</script>
</html>
