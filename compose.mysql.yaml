x-db-tools: &db-tools
  image: ${DB_TOOLS_IMAGE:-itecsa-db-tools:local}
  build:
    context: .
    dockerfile: capaServidor/Dockerfile
    target: database-tools
    args:
      APP_VERSION: ${APP_VERSION:?Definir APP_VERSION en deploy/mysql.env}
  profiles: ["tools"]
  environment: &db-environment
    APP_ENV: production
    NODE_ENV: production
    APP_VERSION: ${APP_VERSION}
    DB_TARGET: mysql-docker
    DB_HOST: mysql
    DB_PORT: "3306"
    DB_USER: ${MYSQL_USER:?Definir MYSQL_USER}
    DB_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD}
    DB_NAME: ${MYSQL_DATABASE:?Definir MYSQL_DATABASE}
    DB_SSL_MODE: required
    DB_SSL_CA_PATH: /run/secrets/mysql-ca.pem
    DB_MIGRATION_USER: ${MYSQL_MIGRATION_USER:?Definir MYSQL_MIGRATION_USER}
    DB_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD:?Definir MYSQL_MIGRATION_PASSWORD}
    MYSQL_INIT_CONFIRM: ${MYSQL_DATABASE}
    MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
    MYSQL_EXPECTED_HOSTNAME: itecsa-mysql
    COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?Definir COMPOSE_PROJECT_NAME}

services:
  mysql:
    image: ${MYSQL_IMAGE:-itecsa-mysql:8.4-pinned}
    command: ["mysqld", "--defaults-extra-file=/etc/itecsa-mysql.cnf"]
    hostname: itecsa-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Definir MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER:?Definir MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - mysql_socket:/var/run/mysqld
      - ./deploy/mysql/mysql.cnf:/etc/itecsa-mysql.cnf:ro
      - mysql_tls:/run/mysql-tls:ro
    networks: [mysql_private]
    healthcheck:
      test: ["CMD", "mysqladmin", "--protocol=TCP", "--host=127.0.0.1", "--ssl-mode=VERIFY_CA", "--ssl-ca=/run/mysql-tls/ca.pem", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 1m

  api:
    image: ${API_IMAGE:-itecsa-api:local}
    build:
      context: .
      dockerfile: capaServidor/Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:?Definir APP_VERSION}
    env_file: ${API_ENV_FILE:-./capaServidor/.env.mysql.docker}
    environment:
      APP_ENV: ${APP_RUNTIME_ENV:-production}
      NODE_ENV: ${APP_RUNTIME_ENV:-production}
      APP_VERSION: ${APP_VERSION}
      PORT: "3000"
      DB_TARGET: mysql-docker
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_NAME: ${MYSQL_DATABASE}
      DB_SSL_MODE: required
      DB_SSL_CA_PATH: /run/secrets/mysql-ca.pem
      NODE_EXTRA_CA_CERTS: /run/secrets/lan-ca.pem
      FRONTEND_ORIGIN: ${PUBLIC_ORIGIN:?Definir PUBLIC_ORIGIN}
      TRUST_PROXY: "1"
      KEYCLOAK_ISSUER: ${PUBLIC_ORIGIN}/realms/itecsa
      KEYCLOAK_JWKS_URI: ${PUBLIC_ORIGIN}/realms/itecsa/protocol/openid-connect/certs
      KEYCLOAK_AUDIENCE: https://api.itecsa.local
      KEYCLOAK_CLIENT_ID: itecsa-web
      KEYCLOAK_ROLE_CLIENT_ID: itecsa-api-v1
      KEYCLOAK_ADMIN_CLIENT_ID: itecsa-backend-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Definir KEYCLOAK_ADMIN_CLIENT_SECRET}
      KEYCLOAK_PIN_RECOVERY_CLIENT_ID: itecsa-pin-recovery
      KEYCLOAK_PIN_RECOVERY_REDIRECT_URI: ${PUBLIC_ORIGIN}/auth/pin-recovery/callback
      ENABLE_DEMO_ROUTES: "false"
    secrets:
      - source: mysql_ca
        target: mysql-ca.pem
      - source: lan_ca
        target: lan-ca.pem
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [default, mysql_private]
    init: true
    restart: unless-stopped
    stop_grace_period: 15s

  web:
    image: ${WEB_IMAGE:-itecsa-web:local}
    build:
      context: .
      dockerfile: capaVista/Dockerfile
      target: production
      args:
        APP_VERSION: ${APP_VERSION:?Definir APP_VERSION}
    env_file: ${WEB_ENV_FILE:-./capaVista/.env}
    environment:
      VITE_AUTH_PROVIDER: keycloak
      VITE_KEYCLOAK_URL: ${PUBLIC_ORIGIN:?Definir PUBLIC_ORIGIN}
      VITE_KEYCLOAK_REALM: itecsa
      VITE_KEYCLOAK_CLIENT_ID: itecsa-web
      VITE_KEYCLOAK_AUDIENCE: https://api.itecsa.local
      VITE_API_BASE_URL: ${PUBLIC_ORIGIN}/api
    volumes:
      - ${LAN_TLS_CERT_FILE:?Definir LAN_TLS_CERT_FILE}:/run/lan-tls/tls.crt:ro
      - ${LAN_TLS_KEY_FILE:?Definir LAN_TLS_KEY_FILE}:/run/lan-tls/tls.key:ro
    group_add:
      - "${LAN_TLS_KEY_GID:-101}"
    depends_on:
      keycloak:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${LAN_BIND_ADDRESS:-0.0.0.0}:443:8443"
    restart: unless-stopped

  keycloak:
    image: ${KEYCLOAK_IMAGE:-itecsa-keycloak:local}
    build:
      context: .
      dockerfile: deploy/keycloak/Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:?Definir APP_VERSION}
    command: ["start", "--optimized", "--import-realm"]
    environment:
      KC_DB: mysql
      KC_DB_URL: "jdbc:mysql://mysql:3306/${KEYCLOAK_DB_NAME:?Definir KEYCLOAK_DB_NAME}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/run/keycloak-trust/mysql.p12&trustCertificateKeyStorePassword=changeit"
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Definir KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Definir KEYCLOAK_DB_PASSWORD}
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?Definir PUBLIC_ORIGIN}
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:?Definir KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?Definir KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD}
    volumes:
      - ./deploy/keycloak/private/itecsa-realm.json:/opt/keycloak/data/import/itecsa-realm.json:ro
      - mysql_trust:/run/keycloak-trust:ro
    depends_on:
      mysql:
        condition: service_healthy
    networks: [default, mysql_private]
    healthcheck:
      test: ["CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3"]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 8
    restart: unless-stopped
    stop_grace_period: 45s

  database-tools:
    <<: *db-tools
    volumes:
      - mysql_state:/run/mysql-state:ro
    command: ["node", "--version"]

  cert-bootstrap:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      APP_VERSION: ${APP_VERSION}
      MYSQL_EXPECTED_HOSTNAME: itecsa-mysql
      MYSQL_CERTS_PATH: /output/certs
      MYSQL_PRIVATE_PATH: /output/private
    volumes:
      - ${MYSQL_CERTS_DIR:-./deploy/mysql/certs}:/output/certs
      - ${MYSQL_PRIVATE_DIR:-./deploy/mysql/private}:/output/private
    command: ["npm", "run", "mysql:generate-tls"]

  cert-install:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      APP_VERSION: ${APP_VERSION}
    volumes:
      - ${MYSQL_CERTS_DIR:-./deploy/mysql/certs}:/input:ro
      - mysql_tls:/output
    command:
      - sh
      - -ec
      - |
        install -o 999 -g 999 -m 0644 /input/ca.pem /output/ca.pem
        install -o 999 -g 999 -m 0644 /input/server-cert.pem /output/server-cert.pem
        install -o 999 -g 999 -m 0600 /input/server-key.pem /output/server-key.pem

  account-bootstrap:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      MYSQL_STANDALONE: "1"
      MYSQL_EXPECTED_HOSTNAME: itecsa-mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER}
      MYSQL_MIGRATION_PASSWORD: ${MYSQL_MIGRATION_PASSWORD}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      MYSQL_REQUIRE_EMPTY: ${MYSQL_REQUIRE_EMPTY:-0}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state
    command:
      - sh
      - -ec
      - |
        npm run mysql:bootstrap-accounts
        chown 1000:1000 /run/mysql-state/instance.env
        chmod 0600 /run/mysql-state/instance.env

  keycloak-db-bootstrap:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state:ro
    command: ["npm", "run", "keycloak:mysql-bootstrap"]

  keycloak-trust-bootstrap:
    image: ${KEYCLOAK_IMAGE:-itecsa-keycloak:local}
    profiles: ["tools"]
    network_mode: none
    user: "0:0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        if [ ! -s /output/mysql.p12 ]; then
          keytool -importcert -noprompt -alias itecsa-mysql-ca -file /input/ca.pem -keystore /output/mysql.p12 -storetype PKCS12 -storepass changeit
          chmod 0644 /output/mysql.p12
        fi
    volumes:
      - ${MYSQL_CERTS_DIR:-./deploy/mysql/certs}/ca.pem:/input/ca.pem:ro
      - mysql_trust:/output

  maintenance:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      MYSQL_STANDALONE: "1"
      MYSQL_EXPECTED_HOSTNAME: itecsa-mysql
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_MIGRATION_USER: ${MYSQL_MIGRATION_USER}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      MYSQL_MAINTENANCE_ACTION: ${MYSQL_MAINTENANCE_ACTION:-lock}
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state:ro
    command: ["npm", "run", "mysql:maintenance"]

  db-deploy:
    <<: *db-tools
    environment:
      <<: *db-environment
    secrets:
      - source: mysql_ca
        target: mysql-ca.pem
    volumes:
      - mysql_state:/run/mysql-state:ro
    networks: [mysql_private]
    command: ["npm", "run", "mysql:deploy"]

  db-verify:
    <<: *db-tools
    environment:
      <<: *db-environment
      MYSQL_EXPECT_API_READ_ONLY: ${MYSQL_EXPECT_API_READ_ONLY:-0}
    secrets:
      - source: mysql_ca
        target: mysql-ca.pem
    volumes:
      - mysql_state:/run/mysql-state:ro
    networks: [mysql_private]
    command: ["npm", "run", "mysql:verify"]

  db-backup:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      APP_VERSION: ${APP_VERSION}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      MYSQL_BACKUP_DIR: /backups
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state:ro
      - ./data/backups/mysql:/backups
    command: ["npm", "run", "mysql:backup"]

  db-restore:
    <<: *db-tools
    environment:
      <<: *db-environment
      MYSQL_BACKUP_DIR: /backups
      MYSQL_RESTORE_FILE: ${MYSQL_RESTORE_FILE:-}
      MYSQL_RESTORE_CONFIRM: ${MYSQL_RESTORE_CONFIRM:-}
    secrets:
      - source: mysql_ca
        target: mysql-ca.pem
    volumes:
      - mysql_state:/run/mysql-state:ro
      - ./data/backups/mysql:/backups:ro
    networks: [mysql_private]
    command: ["npm", "run", "mysql:restore"]

  keycloak-db-backup:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_BACKUP_DIR: /backups
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state:ro
      - ./data/backups/keycloak:/backups
    command: ["npm", "run", "keycloak:mysql-backup"]

  keycloak-db-restore:
    <<: *db-tools
    network_mode: none
    user: "0:0"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_INSTANCE_FILE: /run/mysql-state/instance.env
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME}
      KEYCLOAK_BACKUP_DIR: /backups
      KEYCLOAK_RESTORE_FILE: ${KEYCLOAK_RESTORE_FILE:-}
      KEYCLOAK_RESTORE_CONFIRM: ${KEYCLOAK_RESTORE_CONFIRM:-}
    volumes:
      - mysql_socket:/var/run/mysqld
      - mysql_state:/run/mysql-state:ro
      - ./data/backups/keycloak:/backups:ro
    command: ["npm", "run", "keycloak:mysql-restore"]

  keycloak-first-user:
    <<: *db-tools
    environment:
      <<: *db-environment
      NODE_EXTRA_CA_CERTS: /run/secrets/lan-ca.pem
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      KEYCLOAK_OPERATOR_USERNAME: ${KEYCLOAK_OPERATOR_USERNAME}
      KEYCLOAK_OPERATOR_PASSWORD: ${KEYCLOAK_OPERATOR_PASSWORD}
      FIRST_USER_USERNAME: ${FIRST_USER_USERNAME:-}
      FIRST_USER_EMAIL: ${FIRST_USER_EMAIL:-}
      FIRST_USER_FIRST_NAME: ${FIRST_USER_FIRST_NAME:-}
      FIRST_USER_LAST_NAME: ${FIRST_USER_LAST_NAME:-}
      FIRST_USER_RUT: ${FIRST_USER_RUT:-}
      FIRST_USER_TEMP_PASSWORD: ${FIRST_USER_TEMP_PASSWORD:-}
    secrets:
      - source: mysql_ca
        target: mysql-ca.pem
      - source: lan_ca
        target: lan-ca.pem
    networks: [default, mysql_private]
    command: ["npm", "run", "keycloak:first-user"]

volumes:
  mysql_data:
  mysql_socket:
  mysql_state:
  mysql_tls:
  mysql_trust:

networks:
  mysql_private:
    internal: true

secrets:
  mysql_ca:
    file: ${MYSQL_CERTS_DIR:-./deploy/mysql/certs}/ca.pem
  lan_ca:
    file: ${LAN_CA_FILE:?Definir LAN_CA_FILE}
