server {
    listen 8080;
    server_name _;
    location = /version.json {
        root /usr/share/nginx/html;
        access_log off;
    }
    location / { return 404; }
}

server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /run/lan-tls/tls.crt;
    ssl_certificate_key /run/lan-tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_buffering off;
    }
    # User management belongs to the SPA; other /admin/ routes belong to Keycloak.
    location = /admin/usuarios {
        try_files $uri /index.html;
    }
    location ^~ /admin/usuarios/ {
        try_files $uri /index.html;
    }
    location ~ ^/(realms|resources|admin)/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
    }
    location = /auth/pin-recovery/callback {
        # OIDC authorization codes must not enter access logs or browser caches.
        access_log off;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    location = /runtime-config.js {
        alias /tmp/runtime-config.js;
        default_type application/javascript;
        add_header Cache-Control "no-store" always;
    }
    location = /version.json {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
