name: itecsa-mysql-lab

services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql@sha256:76f0358884cb92d9a086d24e5671c38048d3fef40f2588703d73eb55392d6b69}
    command: ["mysqld", "--defaults-extra-file=/etc/mysql-lab.cnf"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Definir MYSQL_ROOT_PASSWORD en deploy/mysql-lab.env}
      MYSQL_ROOT_HOST: localhost
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Definir MYSQL_DATABASE en deploy/mysql-lab.env}
      MYSQL_USER: ${MYSQL_USER:?Definir MYSQL_USER en deploy/mysql-lab.env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Definir MYSQL_PASSWORD en deploy/mysql-lab.env}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./deploy/mysql-lab/mysql.cnf:/etc/mysql-lab.cnf:ro
      - ./deploy/mysql-lab/certs:/run/mysql-tls:ro
    networks:
      - mysql_private
    healthcheck:
      test: ["CMD", "mysqladmin", "--protocol=TCP", "--host=127.0.0.1", "--ssl-mode=VERIFY_CA", "--ssl-ca=/run/mysql-tls/ca.pem", "ping"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10
    restart: unless-stopped
    stop_grace_period: 1m

volumes:
  mysql_data:

networks:
  mysql_private:
    name: itecsa-mysql-lab-private
    driver: bridge
    internal: true
